# Fișier: test-scriere-r2.yml · v1.0 · 2026-10-30
# Cale: .github/workflows/test-scriere-r2.yml (repo aipath512/firmsfinder-vectorize)
# Descriere: test unic — arată dacă cheia R2 din Secrets are voie să SCRIE în b2b-romania-raw.
#            Scrie un fișier mic doar în test/ (nu atinge raw/), îl citește înapoi și raportează.
name: Test scriere R2 (fișier mic în test/)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: b2b-romania-raw
    steps:
      - name: Scriere + citire înapoi
        run: |
          set -u
          KEY="test/scriere-test-$(date -u +%Y%m%dT%H%M%SZ).txt"
          echo "test scriere R2 $(date -u +%FT%TZ)" > t.txt
          if aws s3 cp t.txt "s3://$R2_BUCKET/$KEY" --endpoint-url "$R2_ENDPOINT"; then
            echo "### REZULTAT: SCRIERE REUȘITĂ (cheia are drept de scriere) — $KEY" | tee -a "$GITHUB_STEP_SUMMARY"
            aws s3 cp "s3://$R2_BUCKET/$KEY" - --endpoint-url "$R2_ENDPOINT" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "### REZULTAT: SCRIERE REFUZATĂ — cheia actuală este doar citire; trebuie token Read & Write" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
